plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flauxo.thanatopractor'
    compileSdk 36

    defaultConfig {
        applicationId "com.flauxo.thanatopractor"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android framework app, no external dependencies needed
}
